<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEEL Paragraph Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a2340;
    --navy-mid: #2d3a5c;
    --accent: #e8a838;
    --accent-light: #fdf3dc;
    --teal: #2cb5a0;
    --teal-light: #e0f7f4;
    --red: #e05252;
    --red-light: #fdeaea;
    --green: #3aaa6e;
    --green-light: #e2f7ed;
    --surface: #f8f7f3;
    --card: #ffffff;
    --text: #1a2340;
    --muted: #6b7a99;
    --border: #e2e0d8;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--surface);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  header {
    background: var(--navy);
    padding: 1.5rem 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  header .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    color: var(--accent);
    letter-spacing: -0.02em;
  }

  header .tagline {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.5);
    font-weight: 300;
    margin-top: 2px;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  .step-indicator {
    display: flex;
    gap: 6px;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }

  .step-dot {
    height: 4px;
    flex: 1;
    background: var(--border);
    border-radius: 2px;
    transition: background 0.3s;
    min-width: 20px;
  }

  .step-dot.active { background: var(--accent); }
  .step-dot.done { background: var(--teal); }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 2rem;
    margin-bottom: 1.5rem;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .step-label {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .step-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    color: var(--navy);
    margin-bottom: 0.5rem;
    line-height: 1.3;
  }

  .step-desc {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }

  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 0.4rem;
    color: var(--navy-mid);
  }

  select, input[type="text"], textarea {
    width: 100%;
    padding: 0.65rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: var(--text);
    background: var(--surface);
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 1.1rem;
  }

  select:focus, input:focus, textarea:focus {
    border-color: var(--accent);
    background: #fff;
  }

  textarea { resize: vertical; min-height: 90px; line-height: 1.6; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.65rem 1.4rem;
    border-radius: 8px;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary {
    background: var(--navy);
    color: #fff;
  }
  .btn-primary:hover { background: var(--navy-mid); transform: translateY(-1px); }

  .btn-accent {
    background: var(--accent);
    color: var(--navy);
  }
  .btn-accent:hover { filter: brightness(1.05); transform: translateY(-1px); }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--surface); }

  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

  .pill-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 1.2rem;
  }

  .pill {
    padding: 0.4rem 0.9rem;
    border-radius: 100px;
    border: 1px solid var(--border);
    font-size: 0.83rem;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--card);
    color: var(--text);
  }

  .pill:hover { border-color: var(--accent); color: var(--navy); }
  .pill.selected { background: var(--navy); color: #fff; border-color: var(--navy); }

  .peel-section {
    margin-bottom: 1.4rem;
  }

  .peel-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
  }

  .peel-badge {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 0.8rem;
    flex-shrink: 0;
  }

  .peel-badge.P { background: #dce9ff; color: #1a4fa0; }
  .peel-badge.E1 { background: #ffe8d0; color: #a0541a; }
  .peel-badge.E2 { background: #fde8ff; color: #7a1aa0; }
  .peel-badge.E3 { background: #e0f0ff; color: #1a6ea0; }
  .peel-badge.L { background: #dcffe8; color: #1a7040; }

  .peel-name {
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--navy);
  }

  .peel-hint {
    font-size: 0.78rem;
    color: var(--muted);
  }

  .peel-timer {
    margin-left: auto;
    font-size: 0.75rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .peel-timer.warning { color: var(--red); font-weight: 500; }

  .feedback-box {
    border-radius: 8px;
    padding: 0.9rem 1rem;
    font-size: 0.85rem;
    margin-top: 0.5rem;
    display: none;
    line-height: 1.5;
  }

  .feedback-box.show { display: block; }
  .feedback-box.ok { background: var(--green-light); color: #1a5235; border: 1px solid #a3ddbf; }
  .feedback-box.warn { background: var(--accent-light); color: #6b4300; border: 1px solid #f5c870; }
  .feedback-box.error { background: var(--red-light); color: #7a1a1a; border: 1px solid #f0b0b0; }
  .feedback-box.info { background: var(--teal-light); color: #0e4038; border: 1px solid #7fd4c8; }

  .ai-response {
    background: var(--navy);
    color: #e8ecf5;
    border-radius: var(--radius);
    padding: 1.5rem;
    font-size: 0.9rem;
    line-height: 1.7;
    margin-bottom: 1.5rem;
    white-space: pre-wrap;
    position: relative;
  }

  .ai-response .ai-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.6rem;
  }

  .loading-dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }

  .loading-dots span {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  .evidence-list {
    list-style: none;
    margin-bottom: 1rem;
  }

  .evidence-list li {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
  }

  .evidence-list li:last-child { border-bottom: none; }

  .ev-num {
    background: var(--accent);
    color: var(--navy);
    border-radius: 4px;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .final-response {
    background: linear-gradient(135deg, #f8f7f3 0%, #eef3ff 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    font-size: 0.95rem;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
  }

  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 1rem;
  }

  .tag {
    padding: 3px 10px;
    border-radius: 100px;
    font-size: 0.75rem;
    font-weight: 500;
  }

  .tag.subject { background: #dce9ff; color: #1a4fa0; }
  .tag.grade { background: #ffe8d0; color: #a0541a; }
  .tag.topic { background: var(--teal-light); color: #0e5046; }

  .score-bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    margin: 0.4rem 0 1rem;
    overflow: hidden;
  }

  .score-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--teal);
    transition: width 0.6s ease;
  }

  .hidden { display: none !important; }

  .btn-row {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin-top: 1rem;
  }

  .section-divider {
    border: none;
    border-top: 1px dashed var(--border);
    margin: 1.5rem 0;
  }

  .prompt-hint {
    background: var(--accent-light);
    border: 1px solid #f5c870;
    border-radius: 8px;
    padding: 0.7rem 1rem;
    font-size: 0.83rem;
    color: #6b4300;
    margin-top: 0.4rem;
    display: none;
  }

  .prompt-hint.show { display: block; }

  .checklist {
    list-style: none;
    font-size: 0.85rem;
  }

  .checklist li {
    padding: 0.4rem 0;
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
    border-bottom: 1px solid var(--border);
  }

  .checklist li:last-child { border-bottom: none; }

  .check-icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">ParagraphCoach</div>
    <div class="tagline">PEEL &amp; PEEEL paragraph builder for NESA HSIE</div>
  </div>
</header>

<div class="container">
  <div class="step-indicator" id="stepIndicator"></div>
  <div id="appContent"></div>
</div>

<script>
const API_KEY_PLACEHOLDER = "";

const NESA_SUBJECTS = [
  "Geography","History","Economics","Business Studies","Legal Studies",
  "Society and Culture","Aboriginal Studies","Ancient History","Modern History",
  "Extension History","Commerce"
];

const GRADES = ["Year 7","Year 8","Year 9","Year 10","Year 11","Year 12"];

const PEEL_DEFS = {
  P: { name: "Point", hint: "State your main argument or topic sentence clearly." },
  E1: { name: "Evidence / Example", hint: "Provide a specific fact, statistic, case study, or example." },
  E2: { name: "Explain", hint: "Explain how your evidence supports your point." },
  E3: { name: "Elaborate", hint: "Develop the idea further — explore causes, consequences, or perspectives." },
  L: { name: "Link", hint: "Connect back to the question and your overall argument." }
};

let state = {
  step: 0,
  subject: "",
  grade: "",
  yearNum: 0,
  topic: "",
  question: "",
  evidence: [],
  sections: { P:"", E1:"", E2:"", E3:"", L:"" },
  timers: {},
  timerIntervals: {},
  isPEEEL: false,
  analysisResult: null,
  finalParagraph: ""
};

const TOTAL_STEPS = 7;

function renderSteps() {
  const ind = document.getElementById("stepIndicator");
  ind.innerHTML = "";
  for(let i = 0; i < TOTAL_STEPS; i++){
    const d = document.createElement("div");
    d.className = "step-dot" + (i < state.step ? " done" : i === state.step ? " active" : "");
    ind.appendChild(d);
  }
}

async function callClaude(messages, systemPrompt) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system: systemPrompt || "You are a helpful NESA HSIE writing coach for Australian high school students.",
      messages
    })
  });
  const data = await res.json();
  return data.content?.[0]?.text || "";
}

function showLoading(containerId) {
  document.getElementById(containerId).innerHTML = `<div class="loading-dots"><span></span><span></span><span></span></div>`;
}

function render() {
  renderSteps();
  const steps = [
    renderStep0, renderStep1, renderStep2, renderStep3,
    renderStep4, renderStep5, renderStep6
  ];
  steps[state.step]();
}

function renderStep0() {
  document.getElementById("appContent").innerHTML = `
    <div class="card">
      <div class="step-label">Step 1 of ${TOTAL_STEPS}</div>
      <div class="step-title">Welcome to ParagraphCoach</div>
      <div class="step-desc">This tool will guide you through writing a strong PEEL or PEEEL paragraph response for your NESA HSIE subject. Let's start with your subject and year.</div>

      <label>Select your NESA HSIE Subject</label>
      <select id="subjectSelect">
        <option value="">— Choose subject —</option>
        ${NESA_SUBJECTS.map(s => `<option value="${s}">${s}</option>`).join("")}
      </select>

      <label>Select your Year / Grade</label>
      <div class="pill-group" id="gradeGroup">
        ${GRADES.map(g => `<button class="pill" onclick="selectGrade('${g}')">${g}</button>`).join("")}
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" onclick="goStep1()">Continue →</button>
      </div>
    </div>
  `;
}

function selectGrade(g) {
  state.grade = g;
  state.yearNum = parseInt(g.replace("Year ",""));
  state.isPEEEL = state.yearNum >= 11;
  document.querySelectorAll(".pill").forEach(p => p.classList.remove("selected"));
  document.querySelectorAll(".pill").forEach(p => { if(p.textContent === g) p.classList.add("selected"); });
}

function goStep1() {
  state.subject = document.getElementById("subjectSelect").value;
  if (!state.subject || !state.grade) { alert("Please select both a subject and a year level."); return; }
  state.step = 1;
  render();
}

function renderStep1() {
  document.getElementById("appContent").innerHTML = `
    <div class="card">
      <div class="tag-row">
        <span class="tag subject">${state.subject}</span>
        <span class="tag grade">${state.grade}</span>
      </div>
      <div class="step-label">Step 2 of ${TOTAL_STEPS}</div>
      <div class="step-title">What's your syllabus topic?</div>
      <div class="step-desc">Enter the specific topic or unit you are studying. For example: "Globalisation", "The Arab-Israeli Conflict", "Consumer Law".</div>

      <label>Syllabus topic</label>
      <input type="text" id="topicInput" placeholder="e.g. Globalisation and Economic Change" value="${state.topic}" />

      <div class="btn-row">
        <button class="btn btn-ghost" onclick="back()">← Back</button>
        <button class="btn btn-primary" onclick="goStep2()">Continue →</button>
      </div>
    </div>
  `;
}

function goStep2() {
  state.topic = document.getElementById("topicInput").value.trim();
  if (!state.topic) { alert("Please enter your syllabus topic."); return; }
  state.step = 2;
  render();
}

function renderStep2() {
  document.getElementById("appContent").innerHTML = `
    <div class="card">
      <div class="tag-row">
        <span class="tag subject">${state.subject}</span>
        <span class="tag grade">${state.grade}</span>
        <span class="tag topic">${state.topic}</span>
      </div>
      <div class="step-label">Step 3 of ${TOTAL_STEPS}</div>
      <div class="step-title">What is the question you need to answer?</div>
      <div class="step-desc">Type or paste the exact question or essay prompt you have been given.</div>

      <label>Your question or prompt</label>
      <textarea id="questionInput" placeholder="e.g. To what extent has globalisation contributed to economic inequality?">${state.question}</textarea>

      <div class="btn-row">
        <button class="btn btn-ghost" onclick="back()">← Back</button>
        <button class="btn btn-primary" onclick="goStep3()">Continue →</button>
      </div>
    </div>
  `;
}

function goStep3() {
  state.question = document.getElementById("questionInput").value.trim();
  if (!state.question) { alert("Please enter your question."); return; }
  state.step = 3;
  render();
}

async function renderStep3() {
  document.getElementById("appContent").innerHTML = `
    <div class="card">
      <div class="tag-row">
        <span class="tag subject">${state.subject}</span>
        <span class="tag grade">${state.grade}</span>
        <span class="tag topic">${state.topic}</span>
      </div>
      <div class="step-label">Step 4 of ${TOTAL_STEPS}</div>
      <div class="step-title">List your evidence</div>
      <div class="step-desc">Provide 3–5 pieces of evidence, examples, case studies, statistics, or key terms that could support your answer. Keep each one brief — a phrase or sentence is enough.</div>

      <div id="evidenceInputs">
        ${[0,1,2,3,4].map((i) => `
          <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:0.6rem;">
            <div class="ev-num">${i+1}</div>
            <textarea id="ev_${i}" placeholder="Evidence ${i+1}${i<2?' (required)':' (optional)'}" style="margin-bottom:0;min-height:52px;">${state.evidence[i]||""}</textarea>
          </div>
        `).join("")}
      </div>

      <div id="evFeedback"></div>

      <div class="btn-row">
        <button class="btn btn-ghost" onclick="back()">← Back</button>
        <button class="btn btn-accent" onclick="reviewEvidence()">Review my evidence →</button>
      </div>
    </div>
  `;
}

async function reviewEvidence() {
  const evs = [0,1,2,3,4].map(i => document.getElementById("ev_"+i).value.trim()).filter(Boolean);
  if (evs.length < 2) { alert("Please add at least 2 pieces of evidence."); return; }
  state.evidence = evs;

  document.getElementById("evFeedback").innerHTML = `
    <div class="ai-response"><div class="ai-label">Reviewing your evidence…</div>
    <div class="loading-dots"><span></span><span></span><span></span></div></div>`;

  const prompt = `You are a NESA HSIE writing coach for Australian high school students. 
Subject: ${state.subject}, ${state.grade}, Topic: ${state.topic}
Question: "${state.question}"
Student's evidence list:
${evs.map((e,i) => `${i+1}. ${e}`).join("\n")}

In 3–5 sentences, give brief, encouraging, and constructive feedback on this evidence list. 
Comment on: relevance to the question, specificity, and variety. 
Suggest any gaps or improvements. Be warm and supportive. Keep it concise.`;

  const reply = await callClaude([{role:"user",content:prompt}]);
  document.getElementById("evFeedback").innerHTML = `
    <div class="ai-response"><div class="ai-label">Evidence Feedback</div>${reply}</div>
    <div class="btn-row" style="margin-top:0;"><button class="btn btn-primary" onclick="nextToScaffold()">Use this evidence — start writing →</button></div>`;
}

function nextToScaffold() {
  state.step = 4;
  render();
}

function renderStep4() {
  const sections = state.isPEEEL
    ? ["P","E1","E2","E3","L"]
    : ["P","E1","E2","L"];

  const sectionMap = {
    P: { letter:"P", label:"Point", badge:"P" },
    E1: { letter:"E", label:"Evidence / Example", badge:"E1" },
    E2: { letter:"E", label:"Explain", badge:"E2" },
    E3: { letter:"E", label:"Elaborate", badge:"E3" },
    L: { letter:"L", label:"Link", badge:"L" }
  };

  const evidenceHTML = state.evidence.map((e,i) => `<li><div class="ev-num">${i+1}</div><span>${e}</span></li>`).join("");

  let sectionsHTML = sections.map(k => {
    const s = sectionMap[k];
    const def = PEEL_DEFS[k];
    return `
      <div class="peel-section" id="sec_${k}">
        <div class="peel-header">
          <div class="peel-badge ${k}">${s.letter}</div>
          <div>
            <div class="peel-name">${def.name}</div>
            <div class="peel-hint">${def.hint}</div>
          </div>
          <div class="peel-timer" id="timer_${k}">0:00</div>
        </div>
        <textarea id="input_${k}" placeholder="Write your ${def.name.toLowerCase()} here…" rows="3" 
          oninput="onSectionInput('${k}')" onfocus="startTimer('${k}')">${state.sections[k]||""}</textarea>
        <div class="prompt-hint" id="hint_${k}">✏️ Need a starting point? Try beginning with: <span id="hintText_${k}"></span></div>
        <div class="feedback-box" id="fb_${k}"></div>
      </div>`;
  }).join('<hr class="section-divider">');

  document.getElementById("appContent").innerHTML = `
    <div class="card">
      <div class="tag-row">
        <span class="tag subject">${state.subject}</span>
        <span class="tag grade">${state.grade}</span>
        <span class="tag topic">${state.topic}</span>
      </div>
      <div class="step-label">Step 5 of ${TOTAL_STEPS} — ${state.isPEEEL ? "PEEEL" : "PEEL"} Scaffold</div>
      <div class="step-title">Write your paragraph</div>
      <div class="step-desc" style="margin-bottom:1rem;">Fill in each section below. Your evidence list is shown for reference. A timer runs while you write — if you take more than 5 minutes to start a section, you'll get a sentence starter.</div>

      <details style="margin-bottom:1.5rem;">
        <summary style="cursor:pointer;font-size:0.85rem;font-weight:500;color:var(--muted);">📋 Your evidence list (click to expand)</summary>
        <ul class="evidence-list" style="margin-top:0.75rem;">${evidenceHTML}</ul>
      </details>

      ${sectionsHTML}

      <div class="btn-row" style="margin-top:1.5rem;">
        <button class="btn btn-ghost" onclick="back()">← Back</button>
        <button class="btn btn-accent" onclick="analyseAll()">Analyse &amp; check my paragraph →</button>
      </div>
    </div>
  `;

  sections.forEach(k => {
    state.timers[k] = 0;
    state.timerIntervals[k] = null;
  });
}

function startTimer(k) {
  if (state.timerIntervals[k]) return;
  state.timerIntervals[k] = setInterval(() => {
    state.timers[k]++;
    const mins = Math.floor(state.timers[k]/60);
    const secs = state.timers[k]%60;
    const el = document.getElementById("timer_"+k);
    if(el) {
      el.textContent = `${mins}:${String(secs).padStart(2,"0")}`;
      if(state.timers[k] >= 300 && state.sections[k].trim().length === 0) {
        el.classList.add("warning");
        showPromptHint(k);
      }
    }
  }, 1000);
}

async function showPromptHint(k) {
  const hintEl = document.getElementById("hint_"+k);
  if(!hintEl || hintEl.classList.contains("show")) return;
  const hintTextEl = document.getElementById("hintText_"+k);
  hintEl.classList.add("show");
  hintTextEl.textContent = "generating…";

  const def = PEEL_DEFS[k];
  const prompt = `You are a NESA HSIE writing coach. A ${state.grade} student is writing a ${state.isPEEEL?"PEEEL":"PEEL"} paragraph for ${state.subject}.
Question: "${state.question}"
Topic: ${state.topic}
Evidence available: ${state.evidence.join("; ")}

The student has been stuck on the "${def.name}" section for 5 minutes.
Write ONE short sentence starter (under 20 words) to help them begin the ${def.name} section. 
Just give the sentence starter — no explanation, no quotation marks.`;

  const reply = await callClaude([{role:"user",content:prompt}]);
  hintTextEl.textContent = reply.trim();
}

function onSectionInput(k) {
  state.sections[k] = document.getElementById("input_"+k).value;
  if(state.sections[k].trim().length > 0) {
    const hintEl = document.getElementById("hint_"+k);
    if(hintEl) hintEl.classList.remove("show");
    if(state.timerIntervals[k]) {
      clearInterval(state.timerIntervals[k]);
      state.timerIntervals[k] = null;
    }
  }
}

async function analyseAll() {
  const sections = state.isPEEEL ? ["P","E1","E2","E3","L"] : ["P","E1","E2","L"];
  const missing = sections.filter(k => !state.sections[k]?.trim());

  if(missing.length > 0) {
    const names = missing.map(k => PEEL_DEFS[k].name).join(", ");
    alert(`Please complete the following sections before analysing: ${names}`);
    return;
  }

  sections.forEach(k => {
    if(state.timerIntervals[k]) clearInterval(state.timerIntervals[k]);
  });

  state.step = 5;
  render();
  await runAnalysis();
}

async function runAnalysis() {
  const sections = state.isPEEEL ? ["P","E1","E2","E3","L"] : ["P","E1","E2","L"];
  const paragraphText = sections.map(k => state.sections[k]).join(" ");

  document.getElementById("analysisOutput").innerHTML = `
    <div class="ai-response"><div class="ai-label">Analysing your paragraph…</div>
    <div class="loading-dots"><span></span><span></span><span></span></div></div>`;

  const sectionDetails = sections.map(k => `${PEEL_DEFS[k].name}: "${state.sections[k]}"`).join("\n");

  const prompt = `You are an expert NESA HSIE writing coach for Australian high school students.
Subject: ${state.subject}, ${state.grade}
Topic: ${state.topic}
Question: "${state.question}"
Paragraph format: ${state.isPEEEL?"PEEEL":"PEEL"}

Student's paragraph sections:
${sectionDetails}

Please analyse the paragraph and respond in this exact JSON format (no extra text):
{
  "overallScore": <number 0-100>,
  "sectionChecks": {
    ${sections.map(k => `"${k}": {"met": <true/false>, "comment": "<1 sentence>"}`).join(",\n    ")}
  },
  "spellingGrammar": ["<issue 1>", "<issue 2>"],
  "strengtheningSuggestions": ["<suggestion 1>", "<suggestion 2>", "<suggestion 3>"],
  "improvedParagraph": "<rewritten version with improvements>",
  "encouragement": "<1-2 encouraging sentences personalised to the student's work>"
}`;

  const reply = await callClaude([{role:"user",content:prompt}]);

  let analysis;
  try {
    const clean = reply.replace(/```json|```/g,"").trim();
    analysis = JSON.parse(clean);
  } catch(e) {
    document.getElementById("analysisOutput").innerHTML = `<div class="feedback-box error show">Sorry, there was an issue analysing your paragraph. Please try again.</div>`;
    return;
  }

  state.analysisResult = analysis;
  state.finalParagraph = analysis.improvedParagraph || "";
  renderAnalysis(analysis);
}

function renderAnalysis(a) {
  const sections = state.isPEEEL ? ["P","E1","E2","E3","L"] : ["P","E1","E2","L"];

  const sectionChecks = sections.map(k => {
    const c = a.sectionChecks?.[k] || {};
    const icon = c.met ? "✅" : "⚠️";
    return `<li><span class="check-icon">${icon}</span><div><strong>${PEEL_DEFS[k].name}:</strong> ${c.comment||""}</div></li>`;
  }).join("");

  const spellItems = (a.spellingGrammar||[]).length > 0
    ? a.spellingGrammar.map(s => `<li><span class="check-icon">🔤</span><span>${s}</span></li>`).join("")
    : `<li><span class="check-icon">✅</span><span>No spelling or grammar issues found.</span></li>`;

  const strengthenItems = (a.strengtheningSuggestions||[]).map(s => `<li><span class="check-icon">💡</span><span>${s}</span></li>`).join("");

  const score = a.overallScore || 0;
  const scoreColor = score >= 75 ? "var(--teal)" : score >= 50 ? "var(--accent)" : "var(--red)";

  document.getElementById("analysisOutput").innerHTML = `
    <div class="card" style="margin-bottom:1rem;">
      <div class="step-label">Overall score</div>
      <div style="display:flex;align-items:baseline;gap:0.5rem;margin-bottom:0.3rem;">
        <span style="font-family:'DM Serif Display',serif;font-size:2.5rem;color:${scoreColor};">${score}</span>
        <span style="color:var(--muted);font-size:1rem;">/100</span>
      </div>
      <div class="score-bar"><div class="score-fill" style="width:${score}%;background:${scoreColor};"></div></div>
      <div class="feedback-box info show">${a.encouragement||""}</div>
    </div>

    <div class="card" style="margin-bottom:1rem;">
      <div class="step-label">Section requirements</div>
      <ul class="checklist">${sectionChecks}</ul>
    </div>

    <div class="card" style="margin-bottom:1rem;">
      <div class="step-label">Spelling &amp; grammar</div>
      <ul class="checklist">${spellItems}</ul>
    </div>

    <div class="card" style="margin-bottom:1rem;">
      <div class="step-label">Strengthening suggestions</div>
      <ul class="checklist">${strengthenItems}</ul>
    </div>

    <div class="btn-row">
      <button class="btn btn-ghost" onclick="goBackToScaffold()">← Edit my paragraph</button>
      <button class="btn btn-accent" onclick="goToFinal()">See improved paragraph →</button>
    </div>
  `;
}

function goBackToScaffold() {
  state.step = 4;
  render();
}

function goToFinal() {
  state.step = 6;
  render();
}

function renderStep5() {
  document.getElementById("appContent").innerHTML = `
    <div class="card">
      <div class="tag-row">
        <span class="tag subject">${state.subject}</span>
        <span class="tag grade">${state.grade}</span>
        <span class="tag topic">${state.topic}</span>
      </div>
      <div class="step-label">Step 6 of ${TOTAL_STEPS} — Analysis</div>
      <div class="step-title">Paragraph feedback</div>
      <div id="analysisOutput"><div class="ai-response"><div class="ai-label">Preparing analysis…</div>
      <div class="loading-dots"><span></span><span></span><span></span></div></div></div>
    </div>
  `;
}

function renderStep6() {
  const sections = state.isPEEEL ? ["P","E1","E2","E3","L"] : ["P","E1","E2","L"];
  const original = sections.map(k => state.sections[k]).join(" ");

  document.getElementById("appContent").innerHTML = `
    <div class="card">
      <div class="tag-row">
        <span class="tag subject">${state.subject}</span>
        <span class="tag grade">${state.grade}</span>
        <span class="tag topic">${state.topic}</span>
      </div>
      <div class="step-label">Step 7 of ${TOTAL_STEPS} — Final paragraph</div>
      <div class="step-title">Your paragraph</div>
      <div class="step-desc">Below is your original paragraph and the AI-suggested improved version.</div>

      <div class="step-label" style="margin-bottom:0.4rem;">Your original paragraph</div>
      <div class="final-response" style="margin-bottom:1.5rem;">${original}</div>

      <div class="step-label" style="margin-bottom:0.4rem;">AI-suggested improved version</div>
      <div class="final-response">${state.finalParagraph}</div>

      <div class="feedback-box info show" style="margin-top:1rem;">
        💡 Remember: use the improved version as inspiration. Always write in your own words and voice for your final submission.
      </div>

      <div class="btn-row" style="margin-top:1.5rem;">
        <button class="btn btn-ghost" onclick="goBackToAnalysis()">← Back to feedback</button>
        <button class="btn btn-primary" onclick="startOver()">Start a new paragraph ↺</button>
      </div>
    </div>
  `;
}

function goBackToAnalysis() {
  state.step = 5;
  render();
  if(state.analysisResult) renderAnalysis(state.analysisResult);
}

function startOver() {
  state = {
    step: 0, subject:"", grade:"", yearNum:0, topic:"", question:"",
    evidence:[], sections:{P:"",E1:"",E2:"",E3:"",L:""},
    timers:{}, timerIntervals:{}, isPEEEL:false, analysisResult:null, finalParagraph:""
  };
  render();
}

function back() {
  if(state.step > 0) { state.step--; render(); }
}

render();
</script>
</body>
</html>
